[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-usage"
version = "0.1.0"
description = "macOS CLI for Claude, Codex, and Cursor usage summaries"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
ai-usage = "ai_usage:main"

[project.urls]
Homepage = "https://github.com/arlequins/ai-usage"
Repository = "https://github.com/arlequins/ai-usage"
Issues = "https://github.com/arlequins/ai-usage/issues"

[tool.setuptools]
py-modules = ["ai_usage"]
