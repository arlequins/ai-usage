[slack]
language = "en" # Supported: en, ja
bot_token_env = "AI_USAGE_SLACK_BOT_TOKEN"
channel_env = "AI_USAGE_SLACK_CHANNEL"
webhook_url_env = "AI_USAGE_SLACK_WEBHOOK_URL"

